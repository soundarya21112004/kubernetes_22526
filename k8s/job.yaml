apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration-job
  namespace: production
spec:
  template:
    spec:
      containers:
        - name: migration
          image: busybox:latest
          command: ["sh", "-c", "echo 'Running DB Migrations...'; sleep 10; echo 'Done!'"]
      restartPolicy: Never
  backoffLimit: 2